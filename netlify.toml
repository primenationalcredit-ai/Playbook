[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Daily sync runs at 6 AM UTC (midnight MST)
[functions."pipedrive-daily-sync"]
  schedule = "0 6 * * *"

# Vertimedia daily metrics email to Jeff (Joe 9/14) - yesterday's summary, sent every morning
[functions."lead-provider-daily-email"]
  schedule = "0 13 * * *"

# Bonus tracking sync - runs hourly during business hours Mon-Sat
# Qualified-doc watchdog: nightly self-heal at 3:30am MT (after 2am autobill+sync).
# Verifies every recent final/PIF payment has its deal checkboxes + bonus events; fixes what is missing.
# 90-day training refreshers: re-assign a completed course 90 days on (Phase E, Joe 8/13).
# 8:00 UTC daily - well before anyone starts, and the 14-day grace means it never locks same-day.
[functions."training-refresher-sweep"]
  schedule = "0 8 * * *"

[functions."monitoring-site-drift-sweep"]
  schedule = "*/20 * * * *"

[functions."qualified-doc-watchdog"]
  schedule = "30 9 * * *"
[functions."consultant-bonus-sync"]
  schedule = "0 12-23 * * 1-6"

# Doc production accelerator threshold map (Joe 9/4, Ralph Evans Jr 265369 + Cristina Gonzalez
# 270261): was manual-trigger only, went stale 2 days, both clients cleared their real
# threshold but showed unqualified because their deals weren't in the cached map at all.
# Same hourly-during-business-hours cadence as consultant-bonus-sync, which reads it.
[functions."doc-threshold-map"]
  schedule = "0 12-23 * * 1-6"

# Zoho payment sync - runs hourly during business hours Mon-Sat
[functions."zoho-payment-sync"]
  schedule = "*/3 8-23 * * *"

# Fill in consultant names (Pipedrive deal owner) on freshly synced payments.
# Runs every 5 min in the business window; does up to 30 rows per run.
[functions."payment-enrich"]
  schedule = "*/15 8-23 * * 1-6"

# Completeness safety net: re-paginates previous + current month from Zoho and inserts any payments the
# hourly page-1 sync missed during a busy stretch. Fast (no per-payment lookups). Twice a day.
[functions."zoho-payment-backfill"]
  schedule = "0 13,18,22 * * *"

# Resolves deal id + type onto backfilled payment rows so enrichment can then attribute them.
[functions."backfill-resolve-deals"]
  schedule = "*/15 8-23 * * 1-6"

[functions."zoho-invoice-sync"]
  schedule = "15,45 12-23 * * 1-6"

# Active-client scan (CRS/Sold/Incomplete). Every 30 min during business window.
# With PD_ACTIVE_PERSONS_FILTER set, one run completes a full refresh.
[functions."am-pipeline-cache"]
  schedule = "*/15 12-23 * * 1-6"

# Pre-warm the consultant bonus cache every 10 min during business hours so the page
# always loads instantly off the cache instead of computing live.
# Around the clock (Joe 8/8, stale-rankings ticket): the old 7AM-6PM CT Mon-Sat
# window left evenings, early mornings, and all of Sunday serving a stale cache -
# the page always serves cache by design, so freshness IS the warm cadence.
[functions."consultant-bonus-warm"]
  schedule = "*/20 * * * *"

# Sync the Ready-to-Quote consult deals from Pipedrive into our own consult_deals table. The bonus
# dashboard reads closing-rate data from that table (never from Pipedrive live), so a rate limit or
# filter hiccup can't break it. Runs offset from the warm so the table is fresh when the cache recomputes.
[functions."sync-consult-deals"]
  schedule = "5,15,25,35,45,55 12-23 * * 1-6"

# DISABLED - was causing duplicate/wrong data
# [functions."sales-sync-backup"]
#   schedule = "0 * * * *"

# DISABLED - was causing duplicate/wrong data  
# [functions."sales-auto-sync"]
#   schedule = "*/5 * * * *"


# Round 2 survey auto-send. Once a day on business days. Sends to clients newly at
# "2ND RD DONE" who haven't been surveyed yet.
[functions."round2-survey-trigger"]
  schedule = "0 15 * * 1-6"

# Daily Google review reconcile. Flags incoming_reviews that have dropped off
# Google (delisted). Runs once a day; one invocation loops every location that
# has pending/assigned reviews, within a time budget.
[functions."review-reconcile"]
  schedule = "*/10 13-15 * * *"
  timeout = 26

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# =============================================
# ENVIRONMENT VARIABLES TO SET IN NETLIFY UI:
# =============================================
# PIPEDRIVE_API_KEY = (set in Netlify)
# PIPEDRIVE_DOMAIN = asapcreditrepair
# SENDGRID_API_KEY = (set in Netlify)
# VITE_SUPABASE_URL = (set in Netlify)
# SUPABASE_SERVICE_ROLE_KEY = (set in Netlify)
# 
# GOOGLE SHEETS API (for Credit Team Scorecard):
# GOOGLE_SERVICE_ACCOUNT_EMAIL = (set in Netlify)
# GOOGLE_PRIVATE_KEY = (set in Netlify)
# GOOGLE_SHEET_ID = (set in Netlify)
# =============================================

# Reconcile the invoice mirror against live Zoho: deletes tombstones (invoices removed
# in Zoho) and corrects stale balances (payments the page-1 sync missed). Runs 5 min
# after each zoho-invoice-sync so the Past Due metric always reflects Zoho truth.
[functions."zoho-invoice-reconcile"]
  schedule = "5,20,35,50 12-23 * * 1-6"

# Affiliate book sync: pulls Pipedrive filter 523931 (portal-link orgs = onboarded
# affiliates, Zapier adds new signups automatically), refreshes contacts/stats/segments.
# Never touches cadence state columns.
[functions."affiliate-book-sync"]
  schedule = "20 12-23 * * 1-6"

# Affiliate cadence engine: every 30 min business hours. Gated by
# app_config.affiliate_engine_enabled - ships disabled, nothing sends until flipped.
[functions."affiliate-cadence-runner"]
  schedule = "*/30 13-23 * * 1-5"

[functions."ar-tracking"]
  timeout = 26

[functions."payment-enrich-tick"]
  schedule = "0 * * * *"

# CRM mirror heartbeat: incremental Pipedrive -> crm_* sync every 10 min,
# offset to :02 so it never collides with the bonus warm on :00.
[functions."crm-sync-tick"]
  schedule = "2,32 * * * *"

# Daily mirror proof: verifies every PD record changed in the last 24h exists
# fresh in crm_*. Verdict lands in crm_sync_state key last_compare. 7am CT.
[functions."crm-compare-tick"]
  schedule = "0 13 * * *"

# Daily field-level spot audit: random recently-changed deals/persons pulled fresh
# from PD, compared field-by-field, mismatches self-heal (PD is master). 7:30am CT.
[functions."crm-deep-verify-tick"]
  schedule = "30 13 * * *"

[functions."invoice-mirror-invariant"]
  schedule = "30 4 * * *"

[functions."project-task-notifier"]
  schedule = "0 14 * * *"

[functions."payment-integrity-watchdog"]
  schedule = "0 11 * * *"

# Daily real Google review counts for the review randomizer (Outscraper, reviewsLimit=1)
[functions."gbp-count-scan"]
  schedule = "30 13 * * *"

# Org-owner map (Joe 9/1): which consultant owns each referral org, for the
# reactivation kicker. Built here so the bonus page only ever reads the cache.
[functions."org-owner-map-refresh"]
  schedule = "20 * * * *"

# Reverse sweep walks deals one at a time against Pipedrive; the default 10s
# ceiling kills it partway. Manual/keyed only, no schedule.
[functions."monitoring-site-reverse-sweep"]
  timeout = 26

# CS DEALS CATCH-UP (Joe 9/18, Floyd Gordon 270982). cs-deals-webhook is
# fire-and-forget: Pipedrive announces a deal change once, and if the database
# is slow at that moment the change is lost forever. This re-checks recently
# updated deals every 30 minutes and repairs anything that cost a CSR credit.
[functions."cs-deals-catchup"]
  schedule = "*/30 * * * *"
  timeout = 26

[functions."cs-deals-catchup-manual"]
  timeout = 26

# Keyed on-demand twin of the daily review check (scheduled functions reject direct calls).
[functions."review-reconcile-manual"]
  timeout = 26

# Database health watchdog (Joe 9/21 outage): emails management if the Playbook database is slow or not answering.
[functions."db-health-watchdog"]
  schedule = "*/10 * * * *"
  timeout = 26
[functions."db-health-watchdog-manual"]
  timeout = 26

# Follow-up cadence engine: needs the full 26s like the other heavy jobs.
[functions."followup-cadence-manual"]
  timeout = 26

# Follow-up cadence runner. PREVIEW until CADENCE_LIVE=1 is set in Netlify.
[functions."followup-cadence"]
  schedule = "*/5 * * * *"
  timeout = 26
