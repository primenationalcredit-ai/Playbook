[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Daily sync runs at 6 AM UTC (midnight MST)
[functions."pipedrive-daily-sync"]
  schedule = "0 6 * * *"

# Bonus tracking sync - runs hourly during business hours Mon-Sat
[functions."consultant-bonus-sync"]
  schedule = "0 12-23 * * 1-6"

# Zoho payment sync - runs hourly during business hours Mon-Sat
[functions."zoho-payment-sync"]
  schedule = "*/5 12-23 * * *"

# Fill in consultant names (Pipedrive deal owner) on freshly synced payments.
# Runs every 5 min in the business window; does up to 30 rows per run.
[functions."payment-enrich"]
  schedule = "*/5 13-23 * * 1-6"

# Completeness safety net: re-paginates previous + current month from Zoho and inserts any payments the
# hourly page-1 sync missed during a busy stretch. Fast (no per-payment lookups). Twice a day.
[functions."zoho-payment-backfill"]
  schedule = "0 13,18,22 * * *"

# Resolves deal id + type onto backfilled payment rows so enrichment can then attribute them.
[functions."backfill-resolve-deals"]
  schedule = "*/5 13-23 * * 1-6"

[functions."zoho-invoice-sync"]
  schedule = "15,45 12-23 * * 1-6"

# Active-client scan (CRS/Sold/Incomplete). Every 30 min during business window.
# With PD_ACTIVE_PERSONS_FILTER set, one run completes a full refresh.
[functions."am-pipeline-cache"]
  schedule = "*/5 12-23 * * 1-6"

# Pre-warm the consultant bonus cache every 10 min during business hours so the page
# always loads instantly off the cache instead of computing live.
[functions."consultant-bonus-warm"]
  schedule = "*/10 12-23 * * 1-6"

# Sync the Ready-to-Quote consult deals from Pipedrive into our own consult_deals table. The bonus
# dashboard reads closing-rate data from that table (never from Pipedrive live), so a rate limit or
# filter hiccup can't break it. Runs offset from the warm so the table is fresh when the cache recomputes.
[functions."sync-consult-deals"]
  schedule = "5,15,25,35,45,55 12-23 * * 1-6"

# DISABLED - was causing duplicate/wrong data
# [functions."sales-sync-backup"]
#   schedule = "0 * * * *"

# DISABLED - was causing duplicate/wrong data  
# [functions."sales-auto-sync"]
#   schedule = "*/5 * * * *"


# Round 2 survey auto-send. Once a day on business days. Sends to clients newly at
# "2ND RD DONE" who haven't been surveyed yet.
[functions."round2-survey-trigger"]
  schedule = "0 15 * * 1-6"

# Daily Google review reconcile. Flags incoming_reviews that have dropped off
# Google (delisted). Runs once a day; one invocation loops every location that
# has pending/assigned reviews, within a time budget.
[functions."review-reconcile"]
  schedule = "0 14 * * *"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# =============================================
# ENVIRONMENT VARIABLES TO SET IN NETLIFY UI:
# =============================================
# PIPEDRIVE_API_KEY = (set in Netlify)
# PIPEDRIVE_DOMAIN = asapcreditrepair
# SENDGRID_API_KEY = (set in Netlify)
# VITE_SUPABASE_URL = (set in Netlify)
# SUPABASE_SERVICE_ROLE_KEY = (set in Netlify)
# 
# GOOGLE SHEETS API (for Credit Team Scorecard):
# GOOGLE_SERVICE_ACCOUNT_EMAIL = (set in Netlify)
# GOOGLE_PRIVATE_KEY = (set in Netlify)
# GOOGLE_SHEET_ID = (set in Netlify)
# =============================================

# Reconcile the invoice mirror against live Zoho: deletes tombstones (invoices removed
# in Zoho) and corrects stale balances (payments the page-1 sync missed). Runs 5 min
# after each zoho-invoice-sync so the Past Due metric always reflects Zoho truth.
[functions."zoho-invoice-reconcile"]
  schedule = "5,20,35,50 12-23 * * 1-6"

# Affiliate book sync: pulls Pipedrive filter 523931 (portal-link orgs = onboarded
# affiliates, Zapier adds new signups automatically), refreshes contacts/stats/segments.
# Never touches cadence state columns.
[functions."affiliate-book-sync"]
  schedule = "20 12-23 * * 1-6"

# Affiliate cadence engine: every 30 min business hours. Gated by
# app_config.affiliate_engine_enabled - ships disabled, nothing sends until flipped.
[functions."affiliate-cadence-runner"]
  schedule = "*/30 13-23 * * 1-5"
